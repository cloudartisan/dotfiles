# Whether this is a personal machine. Controls installation of personal-only
# packages (Brewfile.personal: chat/games) and personal-only system tweaks
# (machine rename, boot chime, Dock). Defaults to true so personal machines
# need no configuration. Work machines override this to false in
# ~/.config/chezmoi/chezmoi.toml:
#
#   [data]
#     personal = false
personal: true

# GitHub account whose public repositories the secret-scanning sweep manages.
# The sweep refuses to act if the authenticated gh account does not match, so
# even if it somehow runs on a work machine it cannot touch work repositories.
github_login: cloudartisan
